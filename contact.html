<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Lucky Bodar</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#E55B23',
                        dark: '#050505',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Anton', 'sans-serif'],
                        aesthetic: ['"Cinzel"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: white; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="antialiased selection:bg-brand selection:text-white flex flex-col min-h-screen">
    
    <!-- Navbar -->
    <nav class="absolute top-0 left-0 w-full px-8 py-6 flex justify-between items-center z-50 pointer-events-none">
            <!-- Logo -->
            <div class="font-sans font-light tracking-[0.2em] text-2xl uppercase pointer-events-auto cursor-pointer transition-all duration-300 hover:scale-110 hover:-translate-y-1 hover:text-white text-white/90 drop-shadow-[0_4px_20px_rgba(0,0,0,0.8)] hover:drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]" onclick="window.location.href='index.html'">
                Portfolio
            </div>

            <!-- Center Pills -->
            <div class="hidden md:flex items-center gap-2 glass rounded-full px-4 py-2 text-sm font-medium pointer-events-auto">
                <a href="about.html" class="px-4 py-1.5 rounded-full transition-all duration-300 text-white/80 hover:bg-white hover:text-black hover:scale-105">About</a>
                <a href="projects.html" class="px-4 py-1.5 rounded-full transition-all duration-300 text-white/80 hover:bg-white hover:text-black hover:scale-105">Projects</a>
                <a href="#services" class="px-4 py-1.5 rounded-full transition-all duration-300 text-white/80 hover:bg-white hover:text-black hover:scale-105">Services</a>
                <a href="#testimonials" class="px-4 py-1.5 rounded-full transition-all duration-300 text-white/80 hover:bg-white hover:text-black hover:scale-105">Testimonials</a>
                <a href="contact.html" class="px-4 py-1.5 rounded-full transition-all duration-300 text-white/80 hover:bg-white hover:text-black hover:scale-105 bg-white text-black scale-105">Contact</a>
            </div>

            
        </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 pt-24 pb-12">
        <div class="glass p-10 md:p-16 rounded-[2rem] w-full max-w-2xl relative overflow-hidden">
            <!-- Glow effect behind form -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3/4 h-3/4 bg-white/5 blur-[100px] rounded-full pointer-events-none"></div>

            <div id="form-container" class="relative z-10">
                <h1 class="text-4xl md:text-5xl font-display mb-2">Let's Work Together</h1>
                <p class="text-white/60 mb-10">Fill out the form below and I will get back to you shortly.</p>
                
                <form id="contact-form" class="flex flex-col gap-6" onsubmit="submitForm(event)">
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-white/50 mb-2">Full Name</label>
                        <input type="text" required class="w-full bg-black/40 border border-white/10 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-white/50 transition-colors" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-white/50 mb-2">Email Address</label>
                        <input type="email" required class="w-full bg-black/40 border border-white/10 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-white/50 transition-colors" placeholder="john@example.com">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-white/50 mb-2">Phone Number</label>
                        <input type="tel" required class="w-full bg-black/40 border border-white/10 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-white/50 transition-colors" placeholder="+1 (555) 000-0000">
                    </div>
                    <button type="submit" class="mt-4 bg-white hover:bg-gray-200 text-black py-4 rounded-xl font-bold tracking-widest uppercase transition-transform hover:scale-[1.02] active:scale-95 shadow-lg shadow-white/5">
                        Continue
                    </button>
                </form>
            </div>

            <!-- Success Message (Hidden by default) -->
            <div id="success-message" class="hidden relative z-10 flex-col items-center justify-center text-center py-10">
                <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-6 border border-white/20">
                    <svg class="w-10 h-10 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-3xl font-display mb-4">Message Sent Successfully!</h2>
                <p class="text-white/70 text-lg">Thank you for reaching out. We will contact you soon.</p>
                <button onclick="window.location.href='index.html'" class="mt-8 px-8 py-3 border border-white/20 rounded-full hover:bg-white/10 transition-colors">Return Home</button>
            </div>
        </div>
    </main>

    <script>
        function submitForm(e) {
            e.preventDefault();
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('success-message').classList.remove('hidden');
            document.getElementById('success-message').classList.add('flex');
        }
    </script>
</body>
</html>
